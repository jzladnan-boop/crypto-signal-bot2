version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-signal-bot
    environment:
      - PYTHONUNBUFFERED=1
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin}
    ports:
      - "5000:5000"
    volumes:
      - ./:/app
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.web
    container_name: crypto-bot-dashboard
    environment:
      - EXPO_PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  bot_data:
